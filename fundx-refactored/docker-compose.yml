services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fundx
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run prisma:deploy && npm run dev:api"
    volumes:
      - .:/app
    env_file:
      - server/.env.example
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
volumes:
  postgres-data:
