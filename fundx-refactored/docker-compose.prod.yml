version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://qfx_user:qfx_dev_pass@db:5432/quickfundx_dev
      - REDIS_URL=redis://:redis_dev_pass@redis:6379/0
      - CORS_ORIGINS=http://localhost,http://localhost:80
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qfx_user
      POSTGRES_PASSWORD: qfx_dev_pass
      POSTGRES_DB: quickfundx_dev
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "redis_dev_pass"]
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
