services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: quickfundx_dev
      POSTGRES_USER: qfx_user
      POSTGRES_PASSWORD: qfx_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - qfx_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qfx_user -d quickfundx_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis_dev_pass
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://qfx_user:qfx_dev_pass@db:5432/quickfundx_dev
      REDIS_URL: redis://:redis_dev_pass@redis:6379/0
      JWT_ACCESS_SECRET: dev_access_secret_minimum_32_characters_long
      JWT_REFRESH_SECRET: dev_refresh_secret_minimum_32_chars_long
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      TESTING: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.scripts.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://qfx_user:qfx_dev_pass@db:5432/quickfundx_dev
      REDIS_URL: redis://:redis_dev_pass@redis:6379/0
      JWT_ACCESS_SECRET: dev_access_secret_minimum_32_characters_long
      JWT_REFRESH_SECRET: dev_refresh_secret_minimum_32_chars_long
    depends_on:
      - redis
      - db
    command: celery -A app.worker:celery_app worker --loglevel=info --concurrency=2

volumes:
  qfx_pg_data:
