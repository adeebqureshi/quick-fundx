[project]
name = "quickfundx-backend"
version = "0.1.0"
description = "QuickFundX FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "PyJWT[crypto]>=2.10.0",
  "passlib[bcrypt]>=1.7.4",
  "redis>=5.2.0",
  "celery[redis]>=5.4.0",
  "httpx>=0.28.0",
  "boto3>=1.35.0",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.12",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-passlib>=1.7.7",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
plugins = ["pydantic.mypy"]
mypy_path = "app"

[[tool.mypy.overrides]]
module = ["celery.*", "passlib.*", "boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
